<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Currency Pro - Calculator</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- ===Start=== -->

    <header class="main-nav">
      <div class="logo-area">
        <span class="logo-text">CURRENCY PRO</span>
      </div>
      <button class="signin-btn">Sign In</button>
    </header>

    <main>
      <section class="result-card">
        <p class="result-label">Converted Amount</p>
        <h1 id="result-number">0.00</h1>
        <span id="result-currency">PKR</span>
      </section>

      <section class="converter-card">
        <div class="currency-group">
          <label for="fromCurrency">From</label>
          <select id="fromCurrency">
            <!-- <option value="USD">USD</option>
            <option value="GBP">GBP</option>
            <option value="SAR">SAR</option>
            <option value="PKR">PKR</option> -->
          </select>
          <input type="number" id="amountInput" placeholder="Enter amount" />
        </div>
        <button id="swapBtn">Swap</button>
        <div class="currency-group">
          <label for="toCurrency">To</label>
          <select id="toCurrency">
            <!-- <option value="PKR">PKR</option>
            <option value="USD">USD</option>
            <option value="GBP">GBP</option>
            <option value="SAR">SAR</option> -->
          </select>
          <input type="text" id="resultOutput" readonly />
        </div>
        <button id="convertBtn">Convert</button>
      </section>
    </main>

    <footer class="main-footer">
    <span class="logo-text">CURRENCY PRO</span>
    <div class="footer-links">
        <a href="#">Terms of Service</a>
        <a href="#">Privacy Policy</a>
        <a href="#">API Documentation</a>
    </div>
    <p class="copyright-text">© 2026 Currency Pro. Professional Financial Tools.</p>
</footer>

    <!-- ===End=== -->
    <script src="script.js"></script>
  </body>
</html>
