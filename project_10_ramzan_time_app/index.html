<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ramzan Time App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- body start -->
    <header>
      <h1>🌙 Ramazan Timing 🌙</h1>
    </header>
    <main>
      <div class="input-section">
        <input type="text" id="cityInput" placeholder="Enter city name" />
        <button id="searchBtn">Get Timing</button>
      </div>
      <div class="result-section">
        <p id="message"></p>
        <div class="card sehri">
          <h2>Sehri</h2>
          <p id="sehriTime">--:--</p>
        </div>
        <div class="card iftar">
          <h2>Iftar</h2>
          <p id="iftarTime">--:--</p>
        </div>
      </div>
    </main>
    <footer>
      <p>Made By Abdul Sattar</p>
    </footer>
    <!-- body ends -->
    <script src="script.js"></script>
  </body>
</html>
