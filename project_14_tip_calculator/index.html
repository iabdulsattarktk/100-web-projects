<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tip Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- start body -->
    <header>
      <nav class="navbar">
        <div class="logo">MyProjects</div>
        <ul class="nav-links">
          <li><a href="#home">Home</a></li>
          <li><a href="#about">About</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <div class="main-container">
        <h1 class="heading">Tip Calculator</h1>
        <input
          type="number"
          id="billAmount"
          class="input"
          placeholder="Enter bill amount"
        />
        <input
          type="number"
          id="tipPercentage"
          class="input"
          placeholder="Enter Tip %"
        />
        <input
          type="number"
          id="numberOfPeople"
          class="input"
          placeholder="Enter number of persons"
        />
        <button id="button" class="button">Calculate</button>
        <div id="result" class="result">
          <p>Tip amount per person <span id="tipAmount">0</span></p>
          <p>Total amount per person <span id="totalAmount">0</span></p>
        </div>
      </div>
    </main>

    <footer>
      <p>&copy; All rights reserved. — 2026</p>
    </footer>
    <!-- end body -->
    <script src="script.js"></script>
  </body>
</html>
